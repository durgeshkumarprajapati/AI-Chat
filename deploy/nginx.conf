# ============================================================
# Document AI / RAG Platform — reverse proxy (nginx)
#
# WHY NGINX INSTEAD OF CADDY:
#   Caddy's headline feature is fully-automatic HTTPS via public ACME
#   (Let's Encrypt). This deployment terminates TLS with a Cloudflare
#   ORIGIN certificate instead (see DEPLOYMENT.md — Cloudflare SSL mode
#   must be "Full (strict)", which requires the origin server to present
#   a certificate Cloudflare itself trusts; a Cloudflare origin cert is
#   NOT publicly trusted by browsers directly, only by Cloudflare, and is
#   issued out-of-band via the Cloudflare dashboard/API, not ACME). That
#   removes Caddy's main advantage here, since both proxies end up
#   needing a statically-provided cert file either way. nginx has the
#   most precise, well-documented configuration surface for the SSE/
#   streaming tuning this app specifically needs (see below), so it was
#   chosen over Caddy for this phase. Caddy remains a perfectly
#   reasonable alternative if a future phase moves to public ACME certs
#   instead of Cloudflare origin certs.
#
# STREAMING ROUTES — found via `grep -rl "ReadableStream\|text/event-stream"
# src/app/api`. Each of these returns `text/event-stream` from a
# `ReadableStream` and already sets its OWN `Cache-Control: no-cache,
# no-transform` response header — the settings below make sure nginx does
# not undo that by buffering the response or applying its own idle
# timeout mid-stream:
#   - /api/chat/stream
#   - /api/assistant/chat
#   - /api/explore/stream
#   - /api/collaboration/events
#
# TRUST_PROXY: checked src/config/env.ts, src/lib/auth.ts, and
# src/features/auth/session.service.ts — the app decides whether to set
# the session cookie's `secure` flag from `process.env.NODE_ENV ===
# 'production'` directly, NOT from inspecting the incoming request's
# scheme/headers. So there is no `TRUST_PROXY`-style env var to configure
# here — as long as the app container runs with NODE_ENV=production (set
# in the Dockerfile), the cookie is marked `secure` correctly regardless
# of this proxy sitting in front of it. Rate limiting elsewhere in the app
# (src/lib/rate-limit.ts and a few API routes) reads `X-Forwarded-For`
# directly, so forwarding that header correctly (below) is what actually
# matters for this app, not a trust-proxy setting.
# ============================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  # Never gzip an SSE stream — it defeats incremental delivery.
  gzip_disable "text/event-stream";

  # Upstream app containers. In docker-compose.prod.yml this resolves via
  # Docker's embedded DNS to every replica started with
  # `docker compose up --scale app=N` — nginx round-robins across them.
  upstream document_ai_app {
    server app:3000;
  }

  # Rate-limit zone for auth-adjacent endpoints (defence in depth; the app
  # already does its own rate limiting — see src/lib/rate-limit.ts).
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

  # ------------------------------------------------------------
  # Standard reverse-proxy headers, shared by every server block below,
  # so the app can correctly see the real client IP/scheme/host.
  # ------------------------------------------------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Cloudflare terminates the public-facing edge; if you also want this
    # origin to redirect any stray plain-HTTP traffic that reaches it
    # directly (bypassing Cloudflare) to HTTPS, uncomment:
    # return 301 https://$host$request_uri;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ~ ^/api/(chat/stream|assistant/chat|explore/stream|collaboration/events)$ {
      # SSE/streaming tuning — see the top-of-file comment for why these
      # four routes specifically need this.
      proxy_buffering         off;
      proxy_cache             off;
      chunked_transfer_encoding on;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
      proxy_set_header X-Accel-Buffering "no";

      proxy_pass http://document_ai_app;
    }

    location ~ ^/api/(auth/login|auth/register)$ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://document_ai_app;
    }

    location / {
      proxy_pass http://document_ai_app;
    }
  }

  # ------------------------------------------------------------
  # HTTPS server — used when terminating TLS at this proxy with a
  # Cloudflare origin certificate (Cloudflare SSL mode: Full (strict)).
  # See DEPLOYMENT.md for how to obtain/mount the cert+key.
  #
  # If you prefer Cloudflare to terminate TLS and connect to this origin
  # over plain HTTP on your private network only (SSL mode: Full, not
  # strict), you can skip this server block entirely and rely on the
  # port-80 block above — but see DEPLOYMENT.md for why "Flexible" mode
  # (Cloudflare-to-origin over plain HTTP on the PUBLIC internet) is
  # unsafe and must not be used.
  # ------------------------------------------------------------
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ~ ^/api/(chat/stream|assistant/chat|explore/stream|collaboration/events)$ {
      proxy_buffering         off;
      proxy_cache             off;
      chunked_transfer_encoding on;
      proxy_read_timeout      3600s;
      proxy_send_timeout      3600s;
      proxy_set_header X-Accel-Buffering "no";

      proxy_pass http://document_ai_app;
    }

    location ~ ^/api/(auth/login|auth/register)$ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://document_ai_app;
    }

    location / {
      proxy_pass http://document_ai_app;
    }
  }
}
