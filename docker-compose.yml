version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: document_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: document_ai
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d document_ai']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: document_ai_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'   # AMQP protocol port
      - '15672:15672' # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: document_ai_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: document_ai_ollama
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Phase 91.9 — optional PyMuPDF extraction service. NOT started by default `docker compose up`
  # (gated behind the "pdf-service" profile) — the Node worker's default PDF_EXTRACTION_PROVIDER
  # is "pdfjs" and never talks to this at all unless you explicitly run:
  #   docker compose --profile pdf-service up -d pdf-service
  # and set PDF_EXTRACTION_PROVIDER=pymupdf / PDF_SERVICE_URL=http://localhost:8000 in .env.
  pdf-service:
    profiles: ['pdf-service']
    build:
      context: ./services/pdf-service
      dockerfile: Dockerfile
    container_name: document_ai_pdf_service
    restart: unless-stopped
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  ollama_data:
